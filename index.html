<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050f22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="펭귄 루프">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="화면 가장자리를 따라 남극 펭귄이 달리는 한 바퀴 액션 게임">
<meta property="og:title" content="펭귄 루프">
<meta property="og:description" content="화면 가장자리를 달리는 남극 펭귄! 탭으로 점프, 달을 탭해 슬로우 필살기">
<meta property="og:image" content="icons/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>펭귄 루프 모바일</title>
<style>
  :root { --ui:#eaf6ff; --sub:#9fd8f5; --accent:#ffa53d; --line:#6ebeff; --ink:#0b1430; --panel:#0d2240; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050f22; color:var(--ui);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
  #stage { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); transform-origin:50% 50%; overflow:hidden; }
  canvas#game { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; }
  #btns { position:absolute; display:flex; gap:6px; pointer-events:auto; }
  .ib { width:34px; height:34px; border:2px solid var(--line); background:rgba(11,26,51,.8); color:var(--ui);
    display:grid; place-items:center; cursor:pointer; box-shadow:0 0 0 2px var(--ink);
    clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px); }
  .ib svg { width:16px; height:16px; shape-rendering:crispEdges; fill:currentColor; }
  .overlay { position:absolute; inset:0; display:none; place-items:center; background:rgba(3,10,22,.35); padding:14px; pointer-events:auto; }
  .overlay.show { display:grid; }
  .card { position:relative; background:var(--panel); border:3px solid var(--line); text-align:center; width:min(330px,100%);
    padding:18px 18px 16px; max-height:100%; overflow:auto;
    clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px); }
  .card::before { content:""; position:absolute; left:6px; right:6px; top:5px; height:3px; background:#1b4c6e; }
  h1 { font-size:34px; font-weight:900; letter-spacing:1px; color:#fff; line-height:1.15;
    text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 3px var(--ink),2px 3px var(--ink),0 5px #1b4c6e; }
  h1 small { display:block; font-size:13px; font-weight:700; color:var(--sub); letter-spacing:3px; text-shadow:none; margin-top:2px; }
  h2 { font-size:24px; font-weight:900; margin:2px 0 8px; text-shadow:0 2px var(--ink); }
  .sub { color:var(--sub); font-size:13px; line-height:1.5; margin:6px 0 10px; }
  .art { display:block; margin:6px auto; image-rendering:pixelated; }
  .btn { display:block; width:100%; margin:8px 0 0; padding:11px 14px 10px; border:none; border-bottom:4px solid #d9761e;
    font-size:16px; font-weight:800; background:var(--accent); color:#2b1600; font-family:inherit; cursor:pointer;
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px); }
  .btn:active { transform:translateY(2px); border-bottom-width:2px; }
  .btn.alt { background:#1b4c6e; color:var(--ui); border-bottom-color:#0b2a44; }
  .row { display:flex; gap:8px; } .row .btn { flex:1; }
  .keys { margin-top:12px; font-size:12px; color:var(--sub); line-height:1.75; }
  .keys b { color:var(--ui); }
  .mode { font-size:11px; opacity:.55; margin-top:6px; }
  .result { display:flex; align-items:center; justify-content:center; gap:12px; margin:4px 0 6px; }
  .stats { text-align:left; font-size:14px; line-height:1.9; color:var(--sub); min-width:130px; }
  .stats b { float:right; color:var(--ui); margin-left:14px; font-size:16px; }
  .stats .fish b { color:#ffd36b; }
  .badge { position:absolute; right:10px; top:10px; background:#ffd66b; color:#3a2200; font-size:12px; font-weight:900; padding:3px 7px;
    box-shadow:0 0 0 2px var(--ink); display:none; transform:rotate(6deg); }
  #ovOver h2 { color:#ff6b6b; }
  #msg { position:absolute; left:50%; bottom:18%; transform:translateX(-50%); background:rgba(11,26,51,.92); border:2px solid var(--line);
    padding:8px 12px; font-size:13px; white-space:nowrap; display:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="btns">
      <button class="ib" id="bPause" aria-label="일시정지"><svg viewBox="0 0 8 8"><rect x="1" y="1" width="2" height="6"/><rect x="5" y="1" width="2" height="6"/></svg></button>
      <button class="ib" id="bSound" aria-label="소리"><svg viewBox="0 0 8 8" id="icoSound"><rect x="0" y="3" width="2" height="2"/><rect x="2" y="2" width="1" height="4"/><rect x="3" y="1" width="1" height="6"/><rect x="5" y="2" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="3" width="1" height="2"/></svg></button>
      <button class="ib" id="bFS" aria-label="전체화면"><svg viewBox="0 0 8 8"><rect x="0" y="0" width="3" height="1"/><rect x="0" y="0" width="1" height="3"/><rect x="5" y="0" width="3" height="1"/><rect x="7" y="0" width="1" height="3"/><rect x="0" y="7" width="3" height="1"/><rect x="0" y="5" width="1" height="3"/><rect x="5" y="7" width="3" height="1"/><rect x="7" y="5" width="1" height="3"/></svg></button>
    </div>

    <div class="overlay show" id="ovTitle">
      <div class="card">
        <h1>펭귄 루프<small>MOBILE</small></h1>
        <canvas class="art" id="titleArt" width="168" height="84"></canvas>
        <div class="sub">화면 가장자리를 따라 남극 펭귄이 달려요!<br>펭귄을 따라 휴대폰을 돌려도 돼요.</div>
        <button class="btn" id="bStart">▶ 시작하기</button>
        <div class="keys"><b>화면 탭</b> 점프 · 공중에서 한 번 더!<br><b>가운데 달 탭</b> 슬로우 필살기 (2초)<br>시작할 때 1개 · 2바퀴마다 1개 충전</div>
        <div class="mode" id="modeTxt"></div>
      </div>
    </div>
    <div class="overlay" id="ovPause">
      <div class="card">
        <h2>일시정지</h2>
        <canvas class="art" id="pauseArt" width="128" height="64"></canvas>
        <button class="btn" id="bResume">▶ 계속하기</button>
        <button class="btn alt" id="bQuit">타이틀로</button>
      </div>
    </div>
    <div class="overlay" id="ovOver">
      <div class="card">
        <div class="badge" id="newRec">신기록!</div>
        <h2>앗, 넘어졌어요!</h2>
        <div class="result">
          <canvas class="art" id="overArt" width="64" height="64"></canvas>
          <div class="stats">점수 <b id="rScore">0</b><br><span class="fish">물고기 <b id="rFish">0</b></span><br>최고 <b id="rBest">0</b></div>
        </div>
        <button class="btn" id="bRetry">↻ 다시 하기</button>
        <div class="row"><button class="btn alt" id="bShare">공유하기</button><button class="btn alt" id="bHome">타이틀로</button></div>
      </div>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script src="art.js"></script>
<script src="common.js"></script>
<script>
'use strict';
// ---------- 규칙 (PC 버전과 같음, 단위: 게임 유닛) ----------
const SC = 1.35;
const G = 2900 * SC, JV = 980 * SC, JV2 = 820 * SC, PHW = 15 * SC, PH = 46 * SC;
const HS = JV * JV / (2 * G);
const SKILL_LAPS = 2, SKILL_SIDES = SKILL_LAPS * 4, SLOW_TIME = 2;
const APU = 67 / 16;                       // 픽셀아트 한 칸 = 4.19 유닛
const DIR = [[1, 0], [0, -1], [-1, 0], [0, 1]];
const NRM = [[0, -1], [-1, 0], [0, 1], [1, 0]];
const TYPES = { spike: [46, 50], spike2: [92, 50], block: [50, 50], tall: [50, 100], seal: [96, 36], hole: [120, 0] };
for (const t in TYPES) TYPES[t] = TYPES[t].map(v => v * SC);

// 대표 모바일 화면비 3종 (세로·가로 모두, 긴 변 : 짧은 변). 처음 연 화면 기준으로 정하고 이후엔 바꾸지 않음
const PRESETS = [
  { name: '16:9',   ratio: 16 / 9,   speed: 1.00 },
  { name: '19.5:9', ratio: 19.5 / 9, speed: 1.06 },
  { name: '20:9',   ratio: 20 / 9,   speed: 1.08 },
];

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const $ = id => document.getElementById(id);
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

const stage = $('stage'), ui = $('ui'), cv = $('game'), ctx = cv.getContext('2d');
let W, H, S, DPR, AP, APd, GT, U, LEN, CORNER, preset, s0 = 0;
let stageRot = 0, stageScale = 1, uiRot = -1, screenRotated = false;
const rp = v => Math.round(v * DPR) / DPR;   // 기기 픽셀에 맞춤

function screenAngle() {
  const o = screen.orientation;
  if (o && typeof o.angle === 'number') return ((o.angle % 360) + 360) % 360;
  if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;
  return 0;
}

// ---------- 화면 배치 (처음 연 화면 기준으로 한 번만) ----------
function setup() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = Math.max(200, innerWidth || 0); H = Math.max(200, innerHeight || 0); S = Math.min(W, H);
  const r = Math.max(W, H) / S;
  preset = PRESETS.reduce((a, b) => Math.abs(Math.log(r / b.ratio)) < Math.abs(Math.log(r / a.ratio)) ? b : a);
  APd = Math.max(2, Math.round(S * .0048 * DPR)); AP = APd / DPR;       // 픽셀 한 칸
  GT = AP * 9; U = AP / APU;
  const lw = (W - 2 * GT) / U, lh = (H - 2 * GT) / U;
  LEN = [lw, lh, lw, lh];
  CORNER = [[GT, H - GT], [W - GT, H - GT], [W - GT, GT], [GT, GT]];
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  s0 = screenAngle(); screenRotated = false; uiRot = -1;
  $('modeTxt').textContent = `${preset.name} ${W > H ? '가로' : '세로'} · ${W}×${H}`;
  buildBg();
  applyStage(); applyUi(0);
}

// 브라우저 화면이 같이 돌아가면, 게임 판은 반대로 돌려서 휴대폰에 붙어 있게 함 (일시정지·재배치 없음)
function applyStage() {
  const vw = innerWidth || W, vh = innerHeight || H;
  const vd = ((screenAngle() - s0) % 360 + 360) % 360;
  if (vd && state !== 'title') screenRotated = true;
  const odd = vd % 180 !== 0, bw = odd ? H : W, bh = odd ? W : H;
  stageScale = Math.min(vw / bw, vh / bh);
  if (Math.abs(stageScale - 1) < .01) stageScale = 1;
  stageRot = -vd;
  stage.style.transform = `translate(-50%,-50%) rotate(${stageRot}deg) scale(${stageScale})`;
}

// ---------- 휴대폰 방향 감지 ----------
let sensorRot = null, sensorFlip = false;
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  let ux = -Math.cos(b) * Math.sin(g); const uy = Math.sin(b);   // 기기 화면 기준 '위쪽' 방향
  if (sensorFlip) ux = -ux;
  if (Math.hypot(ux, uy) < .45) return;                         // 거의 눕혀져 있으면 그대로
  const ang = (Math.atan2(ux, uy) * 180 / Math.PI + 360) % 360; // 0 = 바로, 90 = 왼쪽으로 돌림
  const cand = (Math.round(ang / 90) % 4) * 90;
  const off = Math.abs(((ang - cand + 540) % 360) - 180);
  if (sensorRot === null || off < 32) sensorRot = cand;          // 경계에서 깜빡이지 않도록 여유
}
addEventListener('deviceorientation', onOrient);
function askSensor() {   // iOS: 사용자가 버튼을 누를 때 권한 요청
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(() => {});
  } catch (e) {}
}

// 글자·가운데 UI 방향: 센서 → 브라우저 회전 → (둘 다 안 되면) 펭귄이 달리는 면
function uiAngle() {
  let r;
  if (sensorRot !== null) r = sensorRot - s0;
  else if (screenRotated) r = screenAngle() - s0;
  else if (state === 'title') r = 0;
  else r = -90 * (P.side % 4);
  return ((r % 360) + 360) % 360;
}
function applyUi(d) {
  if (d === uiRot) return;
  uiRot = d;
  const odd = d % 180 !== 0;
  ui.style.width = (odd ? H : W) + 'px'; ui.style.height = (odd ? W : H) + 'px';
  ui.style.transform = `translate(-50%,-50%) rotate(${d}deg)`;
  const b = $('btns'); b.style.top = (GT + 8) + 'px'; b.style.right = (GT + 8) + 'px';
}

// ---------- 남극 밤하늘 (픽셀, 위아래 방향 2가지를 미리 그림) ----------
let bgs = {};
function buildBg() {
  bgs = { 0: makeBg(W, H), 1: makeBg(H, W) };
}
function makeBg(w, h) {
  const BP = AP * 2, lw = Math.ceil(w / BP), lh = Math.ceil(h / BP);
  const c = document.createElement('canvas'); c.width = lw; c.height = lh;
  const b = c.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, lh);
  g.addColorStop(0, '#050f22'); g.addColorStop(.55, '#0d2c4d'); g.addColorStop(1, '#1b4c6e');
  b.fillStyle = g; b.fillRect(0, 0, lw, lh);
  // 계단식으로 색을 끊어 픽셀 느낌
  const img = b.getImageData(0, 0, lw, lh), d = img.data;
  for (let i = 0; i < d.length; i += 4) for (let k = 0; k < 3; k++) d[i + k] = Math.round(d[i + k] / 6) * 6;
  b.putImageData(img, 0, 0);
  for (let i = 0; i < lw * lh / 70; i++) {
    b.fillStyle = `rgba(255,255,255,${rand(.25, .85)})`; b.fillRect(Math.floor(rand(0, lw)), Math.floor(rand(0, lh * .7)), 1, 1);
  }
  const gtl = GT / BP;
  const ridge = (base, amp, col, step) => {
    b.fillStyle = col;
    let y = 0;
    for (let x = 0; x < lw; x++) {
      if (x % step === 0) y = Math.round(base + rand(0, amp));
      b.fillRect(x, lh - gtl - y, 1, y + gtl);
    }
  };
  const s = Math.min(lw, lh);
  ridge(s * .1, s * .14, '#173f60', Math.max(2, Math.round(s * .05)));
  ridge(s * .03, s * .07, '#2a5f84', Math.max(2, Math.round(s * .035)));
  // 멀리 떠 있는 빙산
  for (let i = 0; i < 3; i++) {
    const x0 = Math.floor(rand(0, lw * .8)), y0 = Math.floor(lh - gtl - s * rand(.22, .32)), bw = Math.floor(s * rand(.08, .14));
    for (let j = 0; j < bw; j++) {
      const hh = Math.max(1, Math.round((1 - Math.abs(j / bw * 2 - 1)) * bw * .45));
      b.fillStyle = '#3b7aa6'; b.fillRect(x0 + j, y0 - hh, 1, hh);
      b.fillStyle = '#9fd8f5'; b.fillRect(x0 + j, y0 - hh, 1, 1);
    }
  }
  return { c, BP, w, h, aur: Object.assign(document.createElement('canvas'), { width: lw, height: lh }) };
}
const twinkles = Array.from({ length: 24 }, () => ({ x: Math.random(), y: Math.random() * .6, p: rand(0, 6.28) }));
const flakes = Array.from({ length: 55 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() < .25 ? 2 : 1, v: rand(20, 55), d: rand(0, 6.28) }));

// ---------- 상태 ----------
let state = 'title', time = 0, overT = 0;
let P, sides, fishes, parts, sparks, sidesCleared, dist, fishCount, shake, deathT, jumpBuf, coyote;
let skill = 1, skillProg = 0, slowT = 0, toastT = 0, toastMsg = '';
let best = 0, newRecord = false;
try { best = +localStorage.getItem('penguinLoopBest') || +localStorage.getItem('penguinEdgeBest') || 0; } catch (e) {}

const speed = () => Math.min(840, 360 + sidesCleared * 13) * SC * preset.speed;
const diff = () => Math.min(1, sidesCleared / 28);
const score = () => Math.floor(dist / 10) + fishCount * 25;

function pickType(d) {
  const opts = [['spike', 3], ['block', 3], ['tall', .6 + 2 * d], ['seal', .8 + 1.6 * d],
    ['hole', d > .04 ? 1 + 2 * d : 0], ['spike2', d > .15 ? 1 + 1.5 * d : 0]];
  let r = Math.random() * opts.reduce((s, o) => s + o[1], 0);
  for (const [t, w] of opts) if ((r -= w) <= 0) return t;
  return 'spike';
}
function genSide(k, start, born) {
  const obs = [], fs = [], d = diff(), sp = speed(), n = LEN[k];
  const fishH = () => rand(150, HS + 72);
  let x = start + rand(0, 260);
  while (true) {
    const t = pickType(d), [w, h] = TYPES[t];
    if (x + w > n - 170) break;
    const o = { t, x: x + w / 2, w, h, born };
    obs.push(o);
    if (Math.random() < .45) fs.push({ k, x: o.x, h: fishH(), born });
    // 착지 후 다시 뛸 여유는 보장 + 촘촘한/보통/긴 간격을 불규칙하게 섞음
    const r = Math.random();
    const extra = r < .45 ? rand(0, .2) : r < .8 ? rand(.2, .9) : rand(.9, 2.4);
    const gap = sp * .7 + 30 + sp * extra * (1 - .35 * d);
    if (Math.random() < .35) fs.push({ k, x: x + w + gap * .5, h: fishH(), born });
    x += w + gap;
  }
  sides[k] = obs;
  fishes = fishes.filter(f => f.k !== k).concat(fs.filter(f => f.x < n - 130));
}
function reset() {
  P = { side: 0, x: 150, h: 0, vy: 0, ground: true, jumps: 1, runT: 0, spin: 0, dead: false };
  sides = [[], [], [], []]; fishes = []; parts = []; sparks = [];
  sidesCleared = 0; dist = 0; fishCount = 0; shake = 0; deathT = 0; jumpBuf = 0; coyote = 0;
  skill = 1; skillProg = 0; slowT = 0; toastT = 0;
  genSide(0, 560, -10); genSide(1, 450, -10); genSide(2, 450, -10); genSide(3, 450, -10);
}

// ---------- 소리·진동 ----------
let actx = null, muted = false;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(f1, f2, dur, type = 'sine', vol = .12) {
  if (!actx || muted || state === 'title') return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
function vibrate(ms) { try { if (!muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------- 파티클 (픽셀 먼지) ----------
function wpt(k, x, h) {
  const c = CORNER[k], d = DIR[k], n = NRM[k];

  fn(); ctx.restore();

function puff(k, x, h, n, color, spread = 1) {
  for (let i = 0; i < n; i++) {
    const p = wpt(k, x + rand(-10, 10), h + rand(0, 8));
    const lx = rand(-140, 80) * spread, ly = rand(30, 190) * spread;
    parts.push({ x: p[0], y: p[1], vx: (DIR[k][0] * lx + NRM[k][0] * ly) * U, vy: (DIR[k][1] * lx + NRM[k][1] * ly) * U,
      life: rand(.3, .6), max: .6, s: Math.random() < .3 ? 2 : 1, c: color });

// ---------- 조작 ----------

  else if (P.jumps > 0) { doJump(JV2); P.jumps = 0; beep(620, 1040, .1, 'square', .05); }

}
function toast(m) { toastMsg = m; toastT = 1.4; }

}
function moonPx() { return Math.max(2, Math.round(clamp(S * .085, 30, 52) * 1.25 / 16 * DPR)) / DPR; }

}

// ---------- 업데이트 ----------
function update(dt) {

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of sparks) s.t += dt;
  sparks = sparks.filter(s => s.t < .4);
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (state === 'paused' || state === 'over') { if (state === 'over') overT += dt; return; }
  if (state === 'dying') {
    deathT += dt; P.vy -= G * .6 * dt; P.h += P.vy * dt; P.spin += dt * 11;
    if (deathT > 1.1) gameOver();
    return;
  }
  const demo = state === 'title', sp = speed(), k = P.side % 4;
  P.x += sp * dt; P.runT += dt;
  if (!demo) dist += sp * dt;
  if (jumpBuf > 0) jumpBuf -= dt;
  if (coyote > 0) coyote -= dt;
  if (demo && P.ground) {
    const nx = sides[k].find(o => o.x + o.w / 2 > P.x);
    if (nx && nx.x - P.x < sp * .33) tryJump();
  }
  const hole = !demo && overHole(k, P.x);
  if (P.ground) {
    if (hole) { P.ground = false; P.vy = 0; coyote = .07; }
  } else {
    const prev = P.h;
    P.vy -= G * dt; P.h += P.vy * dt;
    if (P.h <= 0) {
      if (!hole && prev >= 0) {
        P.h = 0; P.vy = 0; P.ground = true; puff(k, P.x, 0, 5, '#eaf6ff', .6);
        if (jumpBuf > 0) { jumpBuf = 0; tryJump(); }
      } else if (!hole) { die(); return; }
      else if (P.h < -(GT / U) - 25) { die(); return; }
    }
  }
  if (P.x >= LEN[k] - PHW) {
    P.side++; P.x = Math.max(0, P.h) + PHW + 2; P.h = 0; P.vy = 0; P.ground = true; P.jumps = 1;
    if (!demo) {
      sidesCleared++;
      if (skill < 1 && ++skillProg >= SKILL_SIDES) { skill = 1; skillProg = 0; toast('필살기 충전!'); beep(520, 1300, .3, 'triangle', .12); vibrate(40); }
    }
    genSide((P.side + 3) % 4, 450, time);
    puff(P.side % 4, P.x, 0, 6, '#ffffff'); beep(300, 520, .08, 'sine', .05);
    return;
  }
  if (!demo) for (const o of sides[k]) {
    if (o.t === 'hole') continue;
    const pad = o.t.startsWith('spike') ? 10 : 5;
    if (P.x + PHW > o.x - o.w / 2 + pad && P.x - PHW < o.x + o.w / 2 - pad && P.h < o.h - pad && P.h + PH > 0) { die(); return; }
  }
  for (const f of fishes) {
    if (!f.got && f.k === k && Math.abs(f.x - P.x) < 30 * SC && Math.abs(f.h - (P.h + PH / 2)) < 40 * SC) {
      f.got = true;
      if (!demo) { fishCount++; beep(880, 1400, .09, 'triangle', .12); }
      const p = wpt(k, f.x, f.h); sparks.push({ x: p[0], y: p[1], t: 0 });
      puff(k, f.x, f.h, 6, '#ffd36b', .7);
    }
  }
  fishes = fishes.filter(f => !f.got);
}

// ---------- 그리기 ----------
const popScale = o => easeOutBack(clamp((time - o.born) / .4, 0, 1));

// 사용자 기준 방향(d)으로 돌린 좌표계: 원점 = 화면 가운데

}

    g.clearRect(0, 0, lw, lh);

    for (let i = 0; i < 3; i++) for (let x = 0; x < lw; x++) {
      const y = lh * (.12 + i * .08) + Math.sin(x * .09 + time * .5 + i * 1.7) * lh * .035 + Math.sin(x * .21 - time * .3 + i) * lh * .015;
      const len = Math.round(lh * (.035 + .02 * Math.sin(x * .05 + time * .4 + i)));

    ctx.fillStyle = 'rgba(255,255,255,.7)';

  });
}
function drawGround() {

    const n = LEN[k] * U;
    const holes = sides[k].filter(o => o.t === 'hole').map(o => { const s = popScale(o); return [(o.x - o.w * s / 2) * U, (o.x + o.w * s / 2) * U]; }).sort((a, b) => a[0] - b[0]);

        }

        ctx.fillStyle = '#ffffff'; ctx.fillRect(h0 - 2 * AP, -AP, 2 * AP, AP); ctx.fillRect(h1, -AP, 2 * AP, AP);

// --- 가운데 UI (사용자 방향으로 회전) ---
function text(s, x, y, size, color, align = 'left', bold = false) {

const tw_ = (s, size, bold) => { ctx.font = `${bold ? 800 : 600} ${Math.max(9, size)}px ${FONT}`; return ctx.measureText(s).width; };

  ctx.fillRect(x + bw, y + bw, w - 2 * bw, h - 2 * bw);

function moonState() { return slowT > 0 ? 'slow' : skill > 0 ? 'ready' : skillProg > 0 ? 'charge' : 'dim'; }
function drawMoon(mp, st) {

      x = gap;

      text(fc, x, 0, val, '#ffd36b', 'left', true); x += tw_(fc, val, true) + hp * .25;
      ctx.fillStyle = 'rgba(110,190,255,.5)'; ctx.fillRect(rp(x), rp(-hp * .25), bw, rp(hp * .5)); x += hp * .25;

// ---------- 화면 전환 ----------

}
let shareFile = null;

  const s = score(); newRecord = s > best;
  if (newRecord) { best = s; try { localStorage.setItem('penguinLoopBest', best); } catch (e) {} }
  $('rScore').textContent = s.toLocaleString(); $('rFish').textContent = fishCount; $('rBest').textContent = best.toLocaleString();
  $('newRec').style.display = newRecord ? 'block' : 'none';
  drawArt('overArt');
  showOv('over');
  prepareShare();
}

// ---------- 공유: 점수 이미지 ----------
function shareData() { return { s: score(), f: fishCount, b: best, n: newRecord ? 1 : 0 }; }
function shareLink() {
  const base = siteBase(); if (!base) return '';
  const d = shareData(); return `${base}share.html?s=${d.s}&f=${d.f}&b=${d.b}&n=${d.n}`;
}
function prepareShare() {   // 공유 버튼을 누르는 즉시 공유창이 뜨도록 미리 만들어 둠
  shareFile = null;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 1080;
    drawShareCard(c.getContext('2d'), 1080, 1080, Object.assign(shareData(), { dead: false }), siteBase());
    c.toBlob(b => { if (b) shareFile = new File([b], `penguin-loop-${score()}.png`, { type: 'image/png' }); }, 'image/png');
  } catch (e) {}
}
function msg(t) { const m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = 'none', 2600); }
async function shareScore() {
  const link = shareLink(), d = shareData();
  const text = `펭귄 루프에서 ${d.s.toLocaleString()}점! 물고기 ${d.f}마리 🐧` + (link ? `\n나도 도전하기 👉 ${link}` : '');
  try {
    if (shareFile && navigator.canShare && navigator.canShare({ files: [shareFile] })) {
      await navigator.share({ files: [shareFile], title: '펭귄 루프', text });
      return;
    }
    if (navigator.share) { await navigator.share({ title: '펭귄 루프', text, url: link || undefined }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  // 공유 기능이 없는 브라우저: 이미지 저장
  if (shareFile) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(shareFile); a.download = shareFile.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    msg('점수 이미지를 저장했어요');
  } else msg('이 브라우저는 공유를 지원하지 않아요');
}

// ---------- 전체화면 ----------
function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFS() {
  const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!f || isFS()) return Promise.resolve(false);
  try { const r = f.call(el, { navigationUI: 'hide' }); return (r && r.then ? r : Promise.resolve()).then(() => true, () => false); }
  catch (e) { return Promise.resolve(false); }
}
function lockOrientation() {   // 안드로이드 전체화면: 지금 방향으로 고정 → 돌려도 화면이 따라 돌지 않음
  try { const o = screen.orientation; if (o && o.lock) o.lock(o.type).catch(() => {}); } catch (e) {}
}
function toggleFS() {
  if (isFS()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
  else enterFS().then(ok => ok && lockOrientation());
}
const waitResize = ms => new Promise(r => { const t = setTimeout(r, ms); addEventListener('resize', () => { clearTimeout(t); setTimeout(r, 120); }, { once: true }); });

const bind = (id, fn) => $(id).addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); fn(); });
let starting = false;
bind('bStart', () => {
  if (starting) return; starting = true;
  ensureAudio(); askSensor();
  enterFS().then(async ok => {
    if (ok) { await waitResize(450); setup(); lockOrientation(); }
    starting = false; start();
  });
});
bind('bResume', () => pause(false)); bind('bQuit', toTitle); bind('bRetry', start); bind('bHome', toTitle);
bind('bShare', shareScore);
bind('bPause', () => state === 'paused' ? pause(false) : pause(true));
bind('bSound', () => { muted = !muted; $('icoSound').style.opacity = muted ? .35 : 1; });
bind('bFS', toggleFS);

// ---------- 입력 ----------
function toStage(cx, cy) {   // 화면 좌표 → 게임 판 좌표 (판이 돌아가 있어도 정확하게)
  const vx = cx - (innerWidth || W) / 2, vy = cy - (innerHeight || H) / 2, a = -stageRot * Math.PI / 180;
  return [(vx * Math.cos(a) - vy * Math.sin(a)) / stageScale + W / 2, (vx * Math.sin(a) + vy * Math.cos(a)) / stageScale + H / 2];
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'play') return;
  const [x, y] = toStage(e.clientX, e.clientY), R = 8 * moonPx() * 1.5;
  if ((x - W / 2) ** 2 + (y - H / 2) ** 2 <= R * R) useSkill(); else tryJump();
});
addEventListener('keydown', e => {   // PC 브라우저에서 열었을 때
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); if (state === 'play') useSkill(); else if (state === 'title') $('bStart').click(); else if (state === 'over' && overT > .35) start(); else if (state === 'paused') pause(false); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (state === 'play') tryJump(); }
  else if (e.code === 'KeyP') state === 'paused' ? pause(false) : pause(true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });
let resizeTimer;
function onResize() {
  const a = screenAngle();
  // 센서 방향 부호 보정: 브라우저가 돌아간 방향과 센서가 반대로 말하면 뒤집음
  if (sensorRot !== null && (a === 90 || a === 270) && sensorRot === (360 - a) % 360) { sensorFlip = !sensorFlip; sensorRot = a; }
  if (state === 'title' && !starting) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { setup(); reset(); }, 120);
  } else applyStage();   // 게임 중: 일시정지·비율 변경 없이 판만 휴대폰에 붙여 둠
}
addEventListener('resize', onResize);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onResize);

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

setup(); reset();
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .033); last = now;   // 첫 프레임 시각이 더 이를 수 있어 음수 방지
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
