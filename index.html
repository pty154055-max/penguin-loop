<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050f22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="펭귄 루프">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="화면 가장자리를 따라 남극 펭귄이 달리는 한 바퀴 액션 게임">
<meta property="og:title" content="펭귄 루프">
<meta property="og:description" content="화면 가장자리를 달리는 남극 펭귄! 꾹 눌러 높이 점프, 달을 탭해 슬로우 필살기">
<meta property="og:image" content="icons/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>펭귄 루프 모바일</title>
<style>
  :root { --ui:#eaf6ff; --sub:#9fd8f5; --accent:#ffa53d; --line:#6ebeff; --ink:#0b1430; --panel:#0d2240; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050f22; color:var(--ui);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
  #stage { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); transform-origin:50% 50%; overflow:hidden; }
  canvas#game { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; inset:0; pointer-events:none; }
  #btns { position:absolute; display:flex; gap:6px; pointer-events:auto; z-index:3; }
  #ovSound { z-index:4; }
  .ib { width:34px; height:34px; border:2px solid var(--line); background:rgba(11,26,51,.8); color:var(--ui);
    display:grid; place-items:center; cursor:pointer; box-shadow:0 0 0 2px var(--ink);
    clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px); }
  .ib svg { width:16px; height:16px; shape-rendering:crispEdges; fill:currentColor; }
  .overlay { position:absolute; inset:0; display:none; place-items:center; background:rgba(3,10,22,.35); padding:10px; pointer-events:auto; }
  .overlay.show { display:grid; }
  .card { position:relative; background:var(--panel); border:3px solid var(--line); text-align:center; width:min(340px,100%);
    padding:14px 16px 14px; max-height:100%; overflow:auto;
    clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px); }
  .card::before { content:""; position:absolute; left:6px; right:6px; top:5px; height:3px; background:#1b4c6e; }
  .card.wide { width:min(560px,100%); display:grid; grid-template-columns:1fr 1.15fr; gap:6px 18px; align-items:center; text-align:center; }
  h1 { font-size:32px; font-weight:900; letter-spacing:1px; color:#fff; line-height:1.15;
    text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 3px var(--ink),2px 3px var(--ink),0 5px #1b4c6e; }
  h1 small { display:block; font-size:12px; font-weight:700; color:var(--sub); letter-spacing:3px; text-shadow:none; margin-top:2px; }
  h2 { font-size:22px; font-weight:900; margin:2px 0 6px; text-shadow:0 2px var(--ink); }
  .sub { color:var(--sub); font-size:12.5px; line-height:1.5; margin:4px 0 6px; }
  .art { display:block; margin:4px auto; image-rendering:pixelated; }
  .btn { display:block; width:100%; margin:7px 0 0; padding:10px 12px 9px; border:none; border-bottom:4px solid #d9761e;
    font-size:15px; font-weight:800; background:var(--accent); color:#2b1600; font-family:inherit; cursor:pointer;
    clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px); }
  .btn:active { transform:translateY(2px); border-bottom-width:2px; }
  .btn.alt { background:#1b4c6e; color:var(--ui); border-bottom-color:#0b2a44; }
  .row { display:flex; gap:8px; } .row .btn { flex:1; }
  .keys { margin-top:8px; font-size:12px; color:var(--sub); line-height:1.7; }
  .keys b { color:var(--ui); }
  .mode { font-size:10.5px; opacity:.55; margin-top:4px; }
  .result { display:flex; align-items:center; justify-content:center; gap:14px; margin:2px 0 4px; }
  .stats { display:grid; grid-template-columns:auto auto; gap:1px 22px; align-items:center; font-size:14px; color:var(--sub); text-align:left; min-width:150px; }
  .stats b { text-align:right; color:var(--ui); font-size:16px; font-variant-numeric:tabular-nums; }
  .stats b.fish { color:#ffd36b; }
  .gift { color:#ffd66b; font-weight:800; font-size:12px; margin:4px 0 2px; display:none; word-break:keep-all; }
  #ovOver .card { width:min(370px,100%); }
  .badge { position:absolute; right:10px; top:10px; background:#ffd66b; color:#3a2200; font-size:12px; font-weight:900; padding:3px 7px;
    box-shadow:0 0 0 2px var(--ink); display:none; transform:rotate(6deg); }
  #ovOver h2 { color:#ff6b6b; }
  .vol { display:grid; grid-template-columns:64px 1fr 40px; align-items:center; gap:8px; margin:8px 0; font-size:13px; color:var(--sub); text-align:left; }
  .segs { display:flex; gap:5px; }
  .segs button { flex:1; height:24px; border:2px solid var(--ink); background:#1b3352; cursor:pointer; padding:0; }
  .segs button.on { background:var(--line); }
  .vol span { text-align:right; color:var(--ui); font-variant-numeric:tabular-nums; }
  #msg { position:absolute; left:50%; bottom:14%; transform:translateX(-50%); background:rgba(11,26,51,.92); border:2px solid var(--line);
    padding:8px 12px; font-size:13px; white-space:nowrap; display:none; z-index:5; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="btns">
      <button class="ib" id="bPause" aria-label="일시정지"><svg viewBox="0 0 8 8"><rect x="1" y="1" width="2" height="6"/><rect x="5" y="1" width="2" height="6"/></svg></button>
      <button class="ib" id="bSound" aria-label="소리 설정"><svg viewBox="0 0 8 8"><rect x="0" y="3" width="2" height="2"/><rect x="2" y="2" width="1" height="4"/><rect x="3" y="1" width="1" height="6"/><rect x="5" y="2" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="3" width="1" height="2"/></svg></button>
      <button class="ib" id="bFS" aria-label="전체화면"><svg viewBox="0 0 8 8"><rect x="0" y="0" width="3" height="1"/><rect x="0" y="0" width="1" height="3"/><rect x="5" y="0" width="3" height="1"/><rect x="7" y="0" width="1" height="3"/><rect x="0" y="7" width="3" height="1"/><rect x="0" y="5" width="1" height="3"/><rect x="5" y="7" width="3" height="1"/><rect x="7" y="5" width="1" height="3"/></svg></button>
    </div>

    <div class="overlay show" id="ovTitle">
      <div class="card wide">
        <div>
          <h1>펭귄 루프<small>MOBILE</small></h1>
          <canvas class="art" id="titleArt" width="168" height="84"></canvas>
        </div>
        <div>
          <div class="sub">화면 가장자리를 따라 남극 펭귄이 달려요!<br>휴대폰을 가로로 들고 플레이하세요.</div>
          <button class="btn" id="bStart">▶ 시작하기</button>
          <div class="keys"><b>화면 탭</b> 점프 · <b>꾹</b> 눌렀다 떼면 더 높이!<br>공중에서 한 번 더 탭하면 이단 점프<br><b>가운데 달 탭</b> 슬로우 필살기 (2초)</div>
          <div class="mode" id="modeTxt"></div>
        </div>
      </div>
    </div>
    <div class="overlay" id="ovPause">
      <div class="card">
        <h2>일시정지</h2>
        <canvas class="art" id="pauseArt" width="128" height="56"></canvas>
        <button class="btn" id="bResume">▶ 계속하기</button>
        <div class="row"><button class="btn alt" id="bSound2">소리 설정</button><button class="btn alt" id="bQuit">타이틀로</button></div>
      </div>
    </div>
    <div class="overlay" id="ovOver">
      <div class="card">
        <div class="badge" id="newRec">신기록!</div>
        <h2>앗, 넘어졌어요!</h2>
        <div class="result">
          <canvas class="art" id="overArt" width="64" height="64"></canvas>
          <div class="stats"><span>점수</span><b id="rScore">0</b><span>물고기</span><b class="fish" id="rFish">0</b><span>최고</span><b id="rBest">0</b></div>
        </div>
        <div class="gift" id="gift"></div>
        <button class="btn" id="bRetry">↻ 다시 하기</button>
        <div class="row"><button class="btn alt" id="bShare">공유하기</button><button class="btn alt" id="bHome">타이틀로</button></div>
      </div>
    </div>
    <div class="overlay" id="ovSound">
      <div class="card">
        <h2>소리 설정</h2>
        <div class="vol"><div>효과음</div><div class="segs" id="segSfx"></div><span id="vSfx"></span></div>
        <div class="vol"><div>배경음악</div><div class="segs" id="segBgm"></div><span id="vBgm"></span></div>
        <button class="btn" id="bSoundClose">닫기</button>
      </div>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script src="art.js"></script>
<script src="common.js"></script>
<script src="music.js"></script>
<script>
'use strict';
// ---------- 규칙 (PC 버전과 같음, 단위: 게임 유닛) ----------
const SC = 1.35;
const G = 2900 * SC, JV2 = 820 * SC, PHW = 15 * SC, PH = 46 * SC;
const JV = 980 * SC, HS = JV * JV / (2 * G);
const SKILL_LAPS = 2, SKILL_SIDES = SKILL_LAPS * 4, SLOW_TIME = 2;
const APU = 67 / 16;                       // 픽셀아트 한 칸 = 4.19 유닛
const FISH_PTS = 50;                       // 물고기 1마리 점수
const HOLD_MIN = .1, HOLD_MAX = .2;        // 1차 점프: 누르는 동안 모으고 떼는 순간 점프. 톡 = 10%, 0.2초 이상 = 100%
const ICE_BOOST = 1.25;
const LV_PILES = 1000, LV_SEAL = 2000, LV_FISH = 3000, LV_MORE = 4000, LV_ICE = 4500, LV_GIFT = 5000;
const MILESTONES = [[LV_PILES, '1000점! 얼음 더미가 커져요'], [LV_SEAL, '2000점! 물범이 가끔 깨요'], [LV_FISH, '3000점! 물고기가 헤엄쳐요'],
  [LV_MORE, '4000점! 장애물이 많아져요'], [LV_ICE, '4500점! 바닥이 미끄러워요'], [LV_GIFT, '5000점! 잼잼에게 인증하면 선물!']];
const GIFT_MSG = '잼잼에게 점수를 인증하면 선물을 드리겠습니다!';
const GAME_URL = 'https://pty154055-max.github.io/penguin-loop/';
const DIR = [[1, 0], [0, -1], [-1, 0], [0, 1]];
const NRM = [[0, -1], [-1, 0], [0, 1], [1, 0]];
const TYPES = { spike: [46, 50], block: [50, 50], seal: [96, 36], hole: [120, 0] };
for (const t in TYPES) TYPES[t] = TYPES[t].map(v => v * SC);

// 대표 모바일 가로 화면비 3종 (긴 변 : 짧은 변)
const PRESETS = [
  { name: '16:9',   ratio: 16 / 9,   speed: 1.00 },
  { name: '19.5:9', ratio: 19.5 / 9, speed: 1.06 },
  { name: '20:9',   ratio: 20 / 9,   speed: 1.08 },
];

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const $ = id => document.getElementById(id);
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');
let W, H, S, DPR, AP, APd, GT, U, LEN, CORNER, preset;
let stageRot = 0, stageScale = 1;
const rp = v => Math.round(v * DPR) / DPR;   // 기기 픽셀에 맞춤

function screenAngle() {
  const o = screen.orientation;
  if (o && typeof o.angle === 'number') return ((o.angle % 360) + 360) % 360;
  if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;
  return 0;
}

// ---------- 화면 배치: 항상 가로 ----------
function setup() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const vw = Math.max(200, innerWidth || 0), vh = Math.max(200, innerHeight || 0);
  W = Math.max(vw, vh); H = Math.min(vw, vh); S = H;
  const r = W / H;
  preset = PRESETS.reduce((a, b) => Math.abs(Math.log(r / b.ratio)) < Math.abs(Math.log(r / a.ratio)) ? b : a);
  APd = Math.max(2, Math.round(S * .0048 * DPR)); AP = APd / DPR;      // 픽셀 한 칸
  GT = AP * 9; U = AP / APU;
  const lw = (W - 2 * GT) / U, lh = (H - 2 * GT) / U;
  LEN = [lw, lh, lw, lh];
  CORNER = [[GT, H - GT], [W - GT, H - GT], [W - GT, GT], [GT, GT]];
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const b = $('btns'); b.style.top = (GT + 6) + 'px'; b.style.right = (GT + 6) + 'px';
  $('modeTxt').textContent = `${preset.name} 가로 · ${W}×${H}`;
  buildBg();
  applyStage();
}

// 휴대폰 방향: 가로 두 방향만 사용 (180도 돌리면 위아래만 바뀜)
let sensorLand = null, flipSince = 0;
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b);     // 기기 화면 기준 '위쪽' 방향
  if (Math.abs(ux) < .5 || Math.abs(ux) < Math.abs(uy)) return;  // 가로로 들고 있을 때만 판단
  const land = ux > 0 ? 90 : 270;                              // 90 = 왼쪽으로 눕힘, 270 = 오른쪽으로 눕힘
  if (land !== sensorLand) { sensorLand = land; applyStage(); }
}
addEventListener('deviceorientation', onOrient);
function askSensor() {   // iOS: 사용자가 버튼을 누를 때 권한 요청
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(() => {});
  } catch (e) {}
}
function applyStage() {
  const vw = innerWidth || W, vh = innerHeight || H, sa = screenAngle();
  let rot;
  if (vw >= vh) {
    // 브라우저 화면이 이미 가로: 브라우저가 돌려주지 못한(화면 회전 잠금) 경우에만 180도 뒤집음
    rot = (sensorLand !== null && (sa === 90 || sa === 270) && sensorLand !== sa) ? 180 : 0;
  } else {
    // 세로 화면(회전 잠금 등): 가로로 돌려서 보여줌
    rot = sensorLand !== null ? ((sensorLand - sa) % 360 + 360) % 360 : 90;
    if (rot !== 90 && rot !== 270) rot = 90;
  }
  const odd = rot % 180 !== 0, bw = odd ? H : W, bh = odd ? W : H;
  stageScale = Math.min(vw / bw, vh / bh);
  if (Math.abs(stageScale - 1) < .01) stageScale = 1;
  stageRot = rot;
  stage.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(${stageScale})`;
}

// ---------- 남극 밤하늘 (픽셀) ----------
let bg;
function buildBg() {
  const BP = AP * 2, lw = Math.ceil(W / BP), lh = Math.ceil(H / BP);
  const c = document.createElement('canvas'); c.width = lw; c.height = lh;
  const b = c.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, lh);
  g.addColorStop(0, '#050f22'); g.addColorStop(.55, '#0d2c4d'); g.addColorStop(1, '#1b4c6e');
  b.fillStyle = g; b.fillRect(0, 0, lw, lh);
  const img = b.getImageData(0, 0, lw, lh), d = img.data;
  for (let i = 0; i < d.length; i += 4) for (let k = 0; k < 3; k++) d[i + k] = Math.round(d[i + k] / 6) * 6;
  b.putImageData(img, 0, 0);
  for (let i = 0; i < lw * lh / 70; i++) {
    b.fillStyle = `rgba(255,255,255,${rand(.25, .85)})`; b.fillRect(Math.floor(rand(0, lw)), Math.floor(rand(0, lh * .7)), 1, 1);
  }
  const gtl = GT / BP, s = lh;
  const ridge = (base, amp, col, step) => {
    b.fillStyle = col; let y = 0;
    for (let x = 0; x < lw; x++) { if (x % step === 0) y = Math.round(base + rand(0, amp)); b.fillRect(x, lh - gtl - y, 1, y + gtl); }
  };
  ridge(s * .1, s * .14, '#173f60', Math.max(2, Math.round(s * .05)));
  ridge(s * .03, s * .07, '#2a5f84', Math.max(2, Math.round(s * .035)));
  for (let i = 0; i < 4; i++) {
    const x0 = Math.floor(rand(0, lw * .85)), y0 = Math.floor(lh - gtl - s * rand(.22, .32)), bw = Math.floor(s * rand(.08, .14));
    for (let j = 0; j < bw; j++) {
      const hh = Math.max(1, Math.round((1 - Math.abs(j / bw * 2 - 1)) * bw * .45));
      b.fillStyle = '#3b7aa6'; b.fillRect(x0 + j, y0 - hh, 1, hh);
      b.fillStyle = '#9fd8f5'; b.fillRect(x0 + j, y0 - hh, 1, 1);
    }
  }
  bg = { c, BP, aur: Object.assign(document.createElement('canvas'), { width: lw, height: lh }) };
}
const twinkles = Array.from({ length: 24 }, () => ({ x: Math.random(), y: Math.random() * .6, p: rand(0, 6.28) }));
const flakes = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() < .25 ? 2 : 1, v: rand(20, 55), d: rand(0, 6.28) }));

// ---------- 상태 ----------
let state = 'title', time = 0, overT = 0;
let P, sides, ice, fishes, parts, sparks, pops, sidesCleared, dist, fishCount, shake, deathT, jumpBuf, coyote, milestone;
let skill = 1, skillProg = 0, slowT = 0, toastT = 0, toastMsg = '';
let best = 0, newRecord = false, keyHeld = false, pending = false;
try { best = +localStorage.getItem('penguinLoopBest2') || 0; } catch (e) {}

const speed = () => Math.min(840, 360 + sidesCleared * 13) * SC * preset.speed;
const diff = () => Math.min(1, sidesCleared / 28);
const score = () => Math.floor(dist / 10) + fishCount * FISH_PTS;
const level = () => (state === 'play' || state === 'dying') ? score() : 0;

// ---------- 맵 생성 (PC와 같은 규칙) ----------
function pickShape(d, lv) {
  let opts = [[['spike', 1, 1], 3], [['block', 1, 1], 3], [['block', 1, 2], .6 + 2 * d], [['seal', 1, 1], .8 + 1.6 * d],
    [['hole', 1, 1], d > .04 ? 1 + 2 * d : 0], [['spike', 2, 1], d > .15 ? 1 + 1.5 * d : 0]];
  if (lv >= LV_PILES) opts.push([['spike', 3, 1], 1], [['block', 2, 1], 1.2], [['block', 2, 2], 1], [['block', 3, 2], .7], [['block', 3, 3], .5]);
  if (lv >= LV_MORE) opts = opts.map(([sh, w]) => [sh, (sh[1] === 1 && sh[2] === 1 && (sh[0] === 'spike' || sh[0] === 'block')) ? w * 3 : w]);
  let r = Math.random() * opts.reduce((s, o) => s + o[1], 0);
  for (const [sh, w] of opts) if ((r -= w) <= 0) return sh;
  return ['spike', 1, 1];
}
function makeOb(t, c, r, born) {
  let w, h;
  if (t === 'spike') { w = TYPES.spike[0] * c; h = TYPES.spike[1]; }
  else if (t === 'block') { w = TYPES.block[0] * c; h = TYPES.block[1] * r; }
  else [w, h] = TYPES[t];
  return { t, c, r, w, h, x: 0, x0: 0, born, roam: 0, awake: 0, wakeCD: rand(1, 4) };
}
const isLow = o => (o.t === 'spike' || o.t === 'block') && o.h <= 75 && o.w <= 70;
const isBig = o => o.h > HS * .75 || o.w > 140;

  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c;
    const s = AP * p.s; ctx.fillRect(rp(p.x - s / 2), rp(p.y - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
  for (const s of sparks) spr('spark' + Math.min(3, Math.floor(s.t / .1)), s.x - 3.5 * AP, s.y - 3.5 * AP);
  for (const s of pops) {   // 물고기 먹은 자리에 +50
    const n = NRM[s.k], rise = s.t * 22 * AP;
    ctx.globalAlpha = clamp((.9 - s.t) * 4, 0, 1);
    text(`+${FISH_PTS}`, s.x + n[0] * rise, s.y + n[1] * rise, Math.max(11, AP * 5), '#ffd66b', 'center', true);
    ctx.globalAlpha = 1;
  }
}
function penguinFrame() {
  if (P.dead) return 'p_dead';
  if (P.ground) return P.slide ? 'p_idle' : 'p_run' + (((Math.floor(P.runT * 12) % 4) + 4) % 4);
  return P.vy > 0 ? 'p_jump' : 'p_fall';
}
function drawPenguin() {
  const k = P.side % 4;
  if (!P.dead && P.h >= 0) withLocal(k, P.x, 0, () => {
    const a = clamp(1 - P.h / 300, .25, 1), w = Math.round(10 * a) * AP;
    ctx.fillStyle = `rgba(10,30,60,${.3 * a})`; ctx.fillRect(-w / 2, -AP, w, AP);
  });
  withLocal(k, P.x, P.h, () => {
    const fr = penguinFrame();
    if (P.dead) { ctx.translate(0, -8 * AP); ctx.rotate(P.spin); ctx.translate(0, 8 * AP); }
    else if (P.slide) ctx.rotate(-.14);
    sprBC(fr, 0, fr === 'p_run1' || fr === 'p_run3' ? -AP : 0);
  });
}
function drawSlow() {
  const a = Math.min(1, slowT * 3, (SLOW_TIME - slowT) * 6), fr = Math.floor(time * 10) % 4;
  ctx.fillStyle = `rgba(120,210,255,${.1 * a})`; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = `rgba(110,230,255,${((150 - i * 35 + (i === fr ? 25 : 0)) / 255 * a).toFixed(3)})`;
    ctx.lineWidth = AP; const o = GT + i * AP + AP / 2;
    ctx.strokeRect(o, o, W - 2 * o, H - 2 * o);
  }
}

// --- 가운데 UI: 점수 | 달 | 물고기 · 최고 (숫자는 오른쪽 정렬, 칸 너비 고정) ---
function text(s, x, y, size, color, align = 'left', bold = false) {
  ctx.font = `${bold ? 800 : 600} ${Math.max(9, size)}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  const o = Math.max(1, size * .08);
  ctx.fillStyle = '#0b1430';
  for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o * 1.4]]) ctx.fillText(s, x + dx, y + dy);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
const tw_ = (s, size, bold) => { ctx.font = `${bold ? 800 : 600} ${Math.max(9, size)}px ${FONT}`; return ctx.measureText(s).width; };
function pixelBox(x, y, w, h, fill, border, bw) {
  x = rp(x); y = rp(y); w = rp(w); h = rp(h); const n = bw * 2;
  ctx.fillStyle = border; ctx.fillRect(x + n, y, w - 2 * n, h); ctx.fillRect(x, y + n, w, h - 2 * n);
  ctx.fillRect(x + bw, y + bw, w - 2 * bw, h - 2 * bw);
  ctx.fillStyle = fill; ctx.fillRect(x + n, y + bw, w - 2 * n, h - 2 * bw); ctx.fillRect(x + bw, y + n, w - 2 * bw, h - 2 * n);
}
function moonState() { return slowT > 0 ? 'slow' : skill > 0 ? 'ready' : skillProg > 0 ? 'charge' : 'dim'; }
function drawMoon(mp, st) {
  const R = 8 * mp;
  if (st === 'ready' || st === 'slow') {
    const pulse = .5 + .5 * Math.sin(time * 3.5), col = st === 'slow' ? '140,220,255' : '255,230,150';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 2.1);
    g.addColorStop(0, `rgba(${col},${(150 + 60 * pulse) / 255})`); g.addColorStop(.5, `rgba(${col},${(45 + 35 * pulse) / 255})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 2.1, 0, 7); ctx.fill();
  }
  const rr = R + 2.2 * mp, sq = Math.max(1 / DPR, rp(mp * 1.1));
  for (let i = 0; i < 8; i++) {
    const lit = st === 'ready' || st === 'slow' || i < skillProg;
    ctx.fillStyle = st === 'slow' ? '#8fe3ff' : st === 'ready' ? '#ffd66b' : lit ? '#9fd8f5' : 'rgba(51,80,127,.8)';
    for (const j of [-1, 0, 1]) {
      const a = -Math.PI / 2 + i * Math.PI / 4 + j * .17;
      ctx.fillRect(rp(Math.cos(a) * rr - sq / 2), rp(Math.sin(a) * rr - sq / 2), sq, sq);
    }
  }
  spr('moon', -R, -R, mp, st);
  text(skill > 0 ? 'x1' : 'x0', R * .9, R * .75, Math.max(10, mp * 3.4), skill ? '#ffffff' : '#9fb0c8', 'center', true);
}
function drawHud() {
  ctx.save(); ctx.translate(W / 2, H / 2);
  const hp = clamp(S * .085, 30, 52), mp = moonPx(), R = 8 * mp, st = moonState();
  const lab = hp * .3, val = hp * .46, bw = Math.max(2 / DPR, rp(hp / 16)), fs = Math.max(1, Math.round(hp / 26 * DPR)) / DPR;
  const slot = tw_('000,000', val, true), fslot = tw_('000', val, true);
  const sc = score().toLocaleString(), bs = Math.max(best, score()).toLocaleString(), fc = String(fishCount);
  const leftW = tw_('점수', lab) + hp * .2 + slot;
  const rightW = 12 * fs + hp * .15 + fslot + hp * .5 + tw_('최고', lab) + hp * .2 + slot;
  const gap = R + hp * .5, half = gap + Math.max(leftW, rightW) + hp * .45;
  pixelBox(-half, -hp / 2, 2 * half, hp, 'rgba(11,26,51,.82)', 'rgba(110,190,255,.6)', bw);
  // 왼쪽: 점수 (달 쪽 끝에 맞춰 오른쪽 정렬)
  text('점수', -gap - leftW, 0, lab, '#9fd8f5');
  text(sc, -gap, 0, val, '#eaf6ff', 'right', true);
  // 오른쪽: 물고기 · 최고 (각 숫자 칸 오른쪽 정렬)
  let x = gap;
  spr('fish', x, -3.5 * fs, fs); x += 12 * fs + hp * .15 + fslot;
  text(fc, x, 0, val, '#ffd36b', 'right', true); x += hp * .25;
  ctx.fillStyle = 'rgba(110,190,255,.5)'; ctx.fillRect(rp(x), rp(-hp * .25), bw, rp(hp * .5)); x += hp * .25;
  text('최고', x, 0, lab, '#9fd8f5'); x += tw_('최고', lab) + hp * .2 + slot;
  text(bs, x, 0, val, '#eaf6ff', 'right', true);
  drawMoon(mp, st);
  const stxt = st === 'slow' ? '슬로우 중!' : st === 'ready' ? '필살기 준비! 달을 탭' : `필살기 충전 ${skillProg}/${SKILL_SIDES}면`;
  text(stxt, 0, R + hp * .75, hp * .3, st === 'ready' || st === 'slow' ? '#fff2a8' : 'rgba(207,224,238,.85)', 'center', st === 'ready' || st === 'slow');
  if (toastT > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, toastT * 2.5);
    text(toastMsg, 0, -R - hp * 1.1 - (1.6 - toastT) * 14, hp * .5, '#dff4ff', 'center', true);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawBackground();
  if (slowT > 0) drawSlow();
  ctx.save();
  if (shake > 0) ctx.translate(rp(rand(-1, 1) * shake * 10), rp(rand(-1, 1) * shake * 10));
  drawGround(); drawObstacles(); drawFish(); drawParts(); drawPenguin();
  ctx.restore();
  if (state !== 'title') drawHud();
  else drawArt('titleArt');
}
function drawArt(id) {   // 모달 안 작은 그림
  const c = $(id), g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  if (id === 'titleArt') {
    for (let i = 0; i < 4; i++) SPRITE.draw(g, 'ground', i * 48, 66, 3);
    const fr = 'p_run' + (((Math.floor(time * 12) % 4) + 4) % 4);
    SPRITE.draw(g, fr, 30, 18 - (fr === 'p_run1' || fr === 'p_run3' ? 3 : 0), 3);
    SPRITE.draw(g, 'spike', 96, 18, 3);
    SPRITE.draw(g, 'fish', 132, 16 + Math.round(Math.sin(time * 4) * 2), 2.5);
  } else if (id === 'overArt') SPRITE.draw(g, 'p_dead', 0, 0, 4);
  else if (id === 'pauseArt') { SPRITE.draw(g, 'seal', 16, 4, 3); SPRITE.draw(g, 'z', 100, 4, 3); }
}

// ---------- 화면 전환 ----------
const ov = { title: $('ovTitle'), pause: $('ovPause'), over: $('ovOver') };
function showOv(name) { for (const k in ov) ov[k].classList.toggle('show', k === name); }
function start() { ensureAudio(); reset(); state = 'play'; newRecord = false; keyHeld = false; showOv(null); }
function toTitle() { reset(); state = 'title'; showOv('title'); }
function pause(on) {
  if (on && state === 'play') { state = 'paused'; showOv('pause'); drawArt('pauseArt'); releaseJump(); }
  else if (!on && state === 'paused') { state = 'play'; showOv(null); }
}
function gameOver() {
  state = 'over'; overT = 0;
  const s = score(); newRecord = s > best;
  if (newRecord) { best = s; try { localStorage.setItem('penguinLoopBest2', best); } catch (e) {} }
  $('rScore').textContent = s.toLocaleString(); $('rFish').textContent = fishCount; $('rBest').textContent = best.toLocaleString();
  $('newRec').style.display = newRecord ? 'block' : 'none';
  const g = $('gift'); g.textContent = '🎁 ' + GIFT_MSG; g.style.display = s >= LV_GIFT ? 'block' : 'none';
  drawArt('overArt');
  showOv('over');
}

// ---------- 소리 설정 (5단계) ----------
function buildVol() {
  for (const key of ['sfx', 'bgm']) {
    const box = $(key === 'sfx' ? 'segSfx' : 'segBgm'); box.innerHTML = '';
    for (let i = 1; i <= VOL_STEPS; i++) {
      const b = document.createElement('button'); b.setAttribute('aria-label', `${i * 20}%`);
      b.addEventListener('click', e => { e.stopPropagation(); vol[key] = (vol[key] === i && i === 1) ? 0 : i; saveVol(); });
      box.appendChild(b);
    }
  }
  refreshVol();
}
function refreshVol() {
  for (const key of ['sfx', 'bgm']) {
    [...$(key === 'sfx' ? 'segSfx' : 'segBgm').children].forEach((b, i) => b.classList.toggle('on', i < vol[key]));
    $(key === 'sfx' ? 'vSfx' : 'vBgm').textContent = vol[key] ? `${vol[key] * 20}%` : '끔';
  }
}
function saveVol() { refreshVol(); applyVol(); try { localStorage.setItem('penguinLoopVol', JSON.stringify(vol)); } catch (e) {} }
function openSound() { ensureAudio(); if (state === 'play') pause(true); $('ovSound').classList.add('show'); }
buildVol();

// ---------- 공유: 점수 + 게임 링크 복사 ----------
function msg(t) { const m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = 'none', 2600); }
function copyOld(text) {
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
async function shareScore() {
  const s = score();
  let text = `펭귄 루프에서 ${s.toLocaleString()}점! 나도 도전하기 👉 ${GAME_URL}`;
  if (s >= LV_GIFT) text += `\n🎁 ${GIFT_MSG}`;
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
  if (!ok) ok = copyOld(text);
  msg(ok ? '링크를 복사했어요! 카톡 대화창에 붙여넣기' : '복사가 안 됐어요. 주소: ' + GAME_URL);
}

// ---------- 전체화면 ----------
function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFS() {
  const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!f || isFS()) return Promise.resolve(false);
  try { const r = f.call(el, { navigationUI: 'hide' }); return (r && r.then ? r : Promise.resolve()).then(() => true, () => false); }
  catch (e) { return Promise.resolve(false); }
}
function lockLandscape() {   // 안드로이드 전체화면: 가로로 고정 (가로 두 방향은 자동으로 뒤집힘)
  try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch (e) {}
}
function toggleFS() {
  if (isFS()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
  else enterFS().then(ok => ok && lockLandscape());
}
const waitResize = ms => new Promise(r => { const t = setTimeout(r, ms); addEventListener('resize', () => { clearTimeout(t); setTimeout(r, 120); }, { once: true }); });

const bind = (id, fn) => $(id).addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); fn(); });
let starting = false;
bind('bStart', () => {
  if (starting) return; starting = true;
  ensureAudio(); askSensor();
  enterFS().then(async ok => {
    if (ok) { lockLandscape(); await waitResize(450); setup(); }
    starting = false; start();
  });
});
bind('bResume', () => pause(false)); bind('bQuit', toTitle); bind('bRetry', start); bind('bHome', toTitle);
bind('bShare', shareScore);
bind('bPause', () => state === 'paused' ? pause(false) : pause(true));
bind('bSound', openSound); bind('bSound2', openSound);
bind('bSoundClose', () => $('ovSound').classList.remove('show'));
bind('bFS', toggleFS);

// ---------- 입력: 누르는 동안 더 높이 ----------
function toStage(cx, cy) {   // 화면 좌표 → 게임 판 좌표 (판이 돌아가 있어도 정확하게)
  const vx = cx - (innerWidth || W) / 2, vy = cy - (innerHeight || H) / 2, a = -stageRot * Math.PI / 180;
  return [(vx * Math.cos(a) - vy * Math.sin(a)) / stageScale + W / 2, (vx * Math.sin(a) + vy * Math.cos(a)) / stageScale + H / 2];
}
const downs = new Set();
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'play') return;
  const [x, y] = toStage(e.clientX, e.clientY), R = 8 * moonPx() * 1.5;
  if ((x - W / 2) ** 2 + (y - H / 2) ** 2 <= R * R) { useSkill(); return; }
  downs.add(e.pointerId); pressJump();
});
const up = e => { if (downs.delete(e.pointerId) && downs.size === 0) releaseJump(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('pointerleave', up);
addEventListener('keydown', e => {   // PC 브라우저에서 열었을 때
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); if (state === 'play') useSkill(); else if (state === 'title') $('bStart').click(); else if (state === 'over' && overT > .35) start(); else if (state === 'paused') pause(false); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (state === 'play') pressJump(); }
  else if (e.code === 'KeyP') state === 'paused' ? pause(false) : pause(true);
});
addEventListener('keyup', e => { if (e.code === 'ArrowUp' || e.code === 'KeyW') releaseJump(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(true); if (actx) actx.suspend(); }
  else if (actx) actx.resume();
});
let resizeTimer;
function onResize() {
  const vw = innerWidth, vh = innerHeight;
  const long = Math.max(vw, vh), short = Math.min(vw, vh);
  // 가로 기준 크기가 바뀐 경우(주소창 등)만 타이틀 화면에서 다시 배치. 게임 중엔 멈추지 않고 판만 맞춤
  if (state === 'title' && !starting && (Math.abs(long - W) > 2 || Math.abs(short - H) > 2)) {
    clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { setup(); reset(); }, 120);
  } else applyStage();
}
addEventListener('resize', onResize);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onResize);

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

setup(); reset();
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .033); last = now;   // 첫 프레임 시각이 더 이를 수 있어 음수 방지
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
